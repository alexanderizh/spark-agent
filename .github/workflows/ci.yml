name: CI

# PR/push 质量门禁（工程化还债方案 Phase 0.1）。
# 现状约束（逐步收紧）：
# - desktop test:unit 首版非阻塞：601 个测试文件的 ubuntu 兼容性清单未知，
#   先跑起来收集失败清单（job 标注 ⚠️），清零后移除 continue-on-error 转阻塞。
# - website 暂不入矩阵：无 typecheck/lint 脚本（Phase 0.5 补齐后加入）。
# - 原生依赖：CI 环境下 scripts/sqlite-abi.sh 会跳过 vendor 切换（vendor 二进制
#   为 macOS arm64），Linux 直接使用 prebuild-install 下载的平台预编译。

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-size:
    name: File size ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check file size ratchet
        run: node scripts/check-file-size.mjs

  quality:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: protocol
            package: '@spark/protocol'
            test-blocking: true
          - label: shared
            package: '@spark/shared'
            test-blocking: true
          - label: storage
            package: '@spark/storage'
            test-blocking: true
          - label: agent-runtime
            package: '@spark/agent-runtime'
            test-blocking: true
          - label: plugin-sdk
            package: '@spark/plugin-sdk'
            test-blocking: true
          - label: desktop
            package: '@spark/desktop'
            test-blocking: false
          - label: website
            package: '@spark/website'
            test-blocking: false
            skip-lint: true
            skip-tests: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ${{ matrix.package }} run typecheck

      - name: Lint
        if: matrix.skip-lint != true
        run: pnpm --filter ${{ matrix.package }} run lint

      - name: Unit tests
        if: matrix.skip-tests != true
        run: pnpm --filter ${{ matrix.package }} run test:unit
        continue-on-error: ${{ matrix.test-blocking == false }}
