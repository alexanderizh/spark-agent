name: Publish Desktop Release

on:
  push:
    branches:
      - master
    paths:
      - apps/desktop/package.json
      - package.json
      - .nvmrc
      - .node-version
      - .github/workflows/publish-desktop-release.yml
  # 手动触发：用于调试签名/公证流水线，不用每次 bump version
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建哪个平台的包（push 触发时此选项被忽略，始终全平台构建）'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - mac
          - win
          - mac-arm64
          - mac-x64
          - win-x64
      publish_to_release:
        description: '是否发布到 GitHub Release（关闭则只构建+签名+公证验证，不发布）'
        required: true
        type: boolean
        default: false
      optional_capabilities_only:
        description: '仅构建并发布 Office 与本机深度可选资源，不构建桌面安装包'
        required: true
        type: boolean
        default: false
      ref:
        description: '构建的分支/tag/commit（默认当前分支）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.optional_capabilities_only == 'true' && 'publish-optional-capabilities' || 'publish-desktop-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      ref: ${{ steps.release.outputs.ref }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # 手动触发时支持指定 ref，否则用默认（push 时是 master）
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep release jobs aligned with the repo-level Node pin that is known
          # to install better-sqlite3 cleanly on Windows runners.
          node-version-file: .nvmrc

      - name: Detect version change and prepare GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          # workflow_dispatch 时为 'workflow_dispatch'，push 时为 'push'
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_TO_RELEASE: ${{ github.event.inputs.publish_to_release }}
          OPTIONAL_CAPABILITIES_ONLY: ${{ github.event.inputs.optional_capabilities_only }}
        run: |
          git fetch --force --tags
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.ref || github.ref }}" >> "$GITHUB_OUTPUT"

          # 可选资源发布和手动的纯构建/签名验证都不依赖桌面 tag，
          # 也不会创建或修改 GitHub Release。
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] \
            && { [ "${OPTIONAL_CAPABILITIES_ONLY}" = "true" ] || [ "${PUBLISH_TO_RELEASE}" != "true" ]; }; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "[manual build-only] should_publish=true, version=${VERSION}"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "push" ]; then
            # push 触发：检查 version 是否真的变化
            PREV_VERSION=""
            if [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              PREV_VERSION=$(git show "${BEFORE_SHA}:apps/desktop/package.json" 2>/dev/null | node -p "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); raw ? JSON.parse(raw).version ?? '' : ''" || true)
            fi

            if [ -n "${PREV_VERSION}" ] && [ "${PREV_VERSION}" = "${VERSION}" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 并行 matrix 任务会向该版本对应的 GitHub Release 上传产物，
          # 因而 tag 必须在构建前存在。绝不能复用指向旧提交的同名 tag。
          HEAD_SHA=$(git rev-parse HEAD)
          if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "${TAG}^{commit}")
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "::error::${TAG} 已指向 ${TAG_SHA}，当前发布提交为 ${HEAD_SHA}。请提升版本号，禁止把新产物发布到旧标签。"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          # Release 必须由单一 prepare job 预先创建。如果交给各个
          # electron-builder matrix job 自行创建，它们会并发 POST 同一
          # tag，只有一个成功，其余任务会收到 422 already_exists。
          # 已存在时仍继续构建，以便失败后重跑能补传/覆盖产物。
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "[release] 复用已有 GitHub Release: ${TAG}"
          else
            echo "[release] 创建 GitHub Release: ${TAG}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f name="${VERSION}" \
              -F draft=false \
              -F prerelease=false \
              >/dev/null
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      # 根据 workflow_dispatch 输入计算要构建的 target 列表。
      # push 触发时 platforms 输入不存在（为空），落到默认分支：三平台全构建。
      # 输出纯 JSON 数组（不带 include 外壳），交给 publish.job 的
      # matrix.include: fromJSON(...) 展开，与原静态写法结构一致。
      - name: Resolve build matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          # Windows pin 到 windows-2022 (VS 2022): electron-rebuild@3 依赖一个
          # 旧版 @electron/node-gyp，无法识别 Visual Studio 2026 (v18)——后者
          # 在 2026 年 5 月成为 windows-latest 默认（见 actions/runner-images#14017）。
          # node-pty 重建时会报 "Could not find any Visual Studio installation"。
          # mac-x64 必须使用 macOS 26/Xcode 26。Native Host 使用的 Swift
          # 源码可在 Xcode 26 编译；macos-15-intel 默认仍是 Xcode 16.4。
          # Windows ARM64 需要真正的 ARM64 runner，不能在 windows-2022/x64
          # 上复用宿主 Node runtime；当前正式发布只提供 Windows x64。
          TARGETS='{"os":"macos-latest","name":"mac-arm64","arch":"arm64","platform":"mac"},{"os":"macos-26-intel","name":"mac-x64","arch":"x64","platform":"mac"},{"os":"windows-2022","name":"win-x64","arch":"x64","platform":"win"}'

          case "${PLATFORMS}" in
            all|"")
              SELECTED="${TARGETS}"
              ;;
            mac)
              SELECTED='{"os":"macos-latest","name":"mac-arm64","arch":"arm64","platform":"mac"},{"os":"macos-26-intel","name":"mac-x64","arch":"x64","platform":"mac"}'
              ;;
            win)
              SELECTED='{"os":"windows-2022","name":"win-x64","arch":"x64","platform":"win"}'
              ;;
            mac-arm64)
              SELECTED='{"os":"macos-latest","name":"mac-arm64","arch":"arm64","platform":"mac"}'
              ;;
            mac-x64)
              SELECTED='{"os":"macos-26-intel","name":"mac-x64","arch":"x64","platform":"mac"}'
              ;;
            win-x64)
              SELECTED='{"os":"windows-2022","name":"win-x64","arch":"x64","platform":"win"}'
              ;;
            *)
              echo "::error::未知的平台选择: ${PLATFORMS}"
              exit 1
              ;;
          esac

          MATRIX="[${SELECTED}]"
          echo "build_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "[matrix] 已选中的构建目标:"
          echo "${MATRIX}" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); for(const t of d) console.log('  -', t.name, '(' + t.os + ')')"

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare
    if: >-
      needs.prepare.outputs.should_publish == 'true'
      && github.event.inputs.optional_capabilities_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push 时用 tag；workflow_dispatch 时用输入的 ref（或当前分支）
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 11.7.0 的 list/why 在大型依赖树上会无界并发读取 package.json，
          # Windows/macOS 会触发 EMFILE；11.13.0 起已限制读取并发。
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node-gyp 9.x (electron-rebuild) imports distutils, removed in Python 3.12+.
      # macOS runner 自带 Python 3.12+ 且受 PEP 668 保护，无法 pip install；改用 3.11。
      - name: Setup Python 3.11 for native module rebuild
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Mac 任务专用：把 Developer ID Application 证书导入临时钥匙串，
      # electron-builder 会自动从钥匙串里发现并签名。
      - name: Import Developer ID certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          bash apps/desktop/scripts/import-cert-ci.sh
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac 签名：electron-builder 会自动发现钥匙串里的 Developer ID 证书。
          # 注意：不在 CI 里用 CSC_LINK 注入签名（已用 import-cert-ci.sh 导入钥匙串），
          # CSC_LINK 这里仅用于公证时回退，实际签名走钥匙串。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # 正式发布必须同时签名外层应用和 Computer Use Native Host。
          REQUIRE_WINDOWS_SIGNING: '1'
          ALLOW_UNSIGNED_WINDOWS_RELEASE: '0'
          # 手动触发时由 workflow_dispatch 输入决定是否发布；push 时默认发布
          PUBLISH_FLAG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_release == 'true') || github.event_name == 'push' }}
        shell: bash
        run: |
          # 4GB 默认堆已不足以完成当前约 1.65 万模块的 renderer chunk 渲染。
          # package build wrapper 会保证至少 8GB；CI 这里显式声明，便于日志和排障。
          # max-old-space-size 是上限而非预分配，不会在启动时直接占用 8GB。
          export NODE_OPTIONS="--max-old-space-size=8192"
          echo "[publish] NODE_OPTIONS=${NODE_OPTIONS}"

          # 非 Windows 任务清理 Windows 签名变量，避免污染 macOS 签名流程。
          if [ "$RUNNER_OS" != "Windows" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export -n WIN_CSC_LINK WIN_CSC_KEY_PASSWORD 2>/dev/null || true
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            security find-identity -v -p codesigning | grep "Developer ID Application"
          fi

          # 根据 PUBLISH_FLAG 决定是否发布到 GitHub Release
          if [ "${PUBLISH_FLAG}" = "true" ]; then
            echo "[publish] 发布到 GitHub Release"
            PUBLISH_OPT="--publish always"
          else
            echo "[publish] 仅构建+签名+公证，不发布到 Release（调试模式）"
            PUBLISH_OPT="--publish never"
          fi

          run_mac_build_with_retry() {
            local attempts=2
            local attempt=1
            local log_file="${RUNNER_TEMP}/build-mac-${{ matrix.arch }}.log"
            local exit_code
            local devices

            while [ "$attempt" -le "$attempts" ]; do
              echo "[publish] macOS build attempt ${attempt}/${attempts}"
              rm -f "$log_file"

              set +e
              bash apps/desktop/scripts/build-mac-release.sh "${{ matrix.arch }}" ${PUBLISH_OPT} 2>&1 | tee "$log_file"
              exit_code=${PIPESTATUS[0]}
              set -e

              if [ "$exit_code" -eq 0 ]; then
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ] \
                || ! grep -q "Command failed: hdiutil detach" "$log_file" \
                || ! grep -q "Resource busy" "$log_file"; then
                return "$exit_code"
              fi

              echo "[retry] DMG detach hit 'Resource busy'; force-detaching stale disk images before one retry."
              devices="$(grep -Eo '/dev/disk[0-9]+' "$log_file" | sort -u || true)"
              if [ -n "$devices" ]; then
                while IFS= read -r device; do
                  [ -n "$device" ] || continue
                  hdiutil detach -force "$device" || true
                done <<< "$devices"
              fi

              rm -f apps/desktop/dist/*.dmg apps/desktop/dist/*.blockmap
              attempt=$((attempt + 1))
            done
          }

          if [ "${{ matrix.platform }}" = "win" ]; then
            bash apps/desktop/scripts/build-win-release.sh "${{ matrix.arch }}" ${PUBLISH_OPT}
          else
            run_mac_build_with_retry
          fi

      # 上传安装包为「工作流构件」（私有，非公开 Release），供调试/测试下载。
      # 正式发布时由审批后的 publish-to-official-website job 汇总这些构件；
      # 关闭 publish_to_release 时也仍能拿到产物做签名/安装验证。
      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.blockmap
          if-no-files-found: warn
          retention-days: 5

      # 构建结束后清理钥匙串，避免证书残留在 runner 上（安全最佳实践）
      - name: Cleanup keychain (macOS only)
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/spark-build.keychain-db" 2>/dev/null || true

  # GitHub Release（含所有 matrix 产物）完成后才进入此 job。
  # official-website-production Environment 的 required reviewer 会在 job
  # 启动前统一拦截，因此一次审批即可控制 MinIO + edu-server 的正式发布。
  publish-to-official-website:
    name: Approve and publish to official website
    needs:
      - prepare
      - publish
    if: >-
      needs.prepare.outputs.should_publish == 'true'
      && ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_release == 'true')
          || github.event_name == 'push')
    environment:
      name: official-website-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: apps/desktop/dist
          merge-multiple: true

      - name: Check official release config
        shell: bash
        env:
          RELEASE_API_BASE: ${{ secrets.RELEASE_API_BASE }}
          RELEASE_CI_TOKEN: ${{ secrets.RELEASE_CI_TOKEN }}
          RELEASE_MINIO_ENDPOINT: ${{ secrets.RELEASE_MINIO_ENDPOINT }}
          RELEASE_MINIO_BUCKET: ${{ secrets.RELEASE_MINIO_BUCKET }}
          RELEASE_MINIO_ACCESS_KEY: ${{ secrets.RELEASE_MINIO_ACCESS_KEY }}
          RELEASE_MINIO_SECRET_KEY: ${{ secrets.RELEASE_MINIO_SECRET_KEY }}
        run: |
          missing=()
          for v in RELEASE_API_BASE RELEASE_CI_TOKEN \
                   RELEASE_MINIO_ENDPOINT RELEASE_MINIO_BUCKET \
                   RELEASE_MINIO_ACCESS_KEY RELEASE_MINIO_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少正式发布 secrets: ${missing[*]}"
            exit 1
          fi

      - name: Upload all artifacts to MinIO
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          ENDPOINT_URL: ${{ secrets.RELEASE_MINIO_ENDPOINT }}
          BUCKET: ${{ secrets.RELEASE_MINIO_BUCKET }}
          CHANNEL: stable
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          DEST="s3://${BUCKET}/${CHANNEL}/${VERSION}/"
          echo "[minio] uploading all approved installers → ${DEST}"
          aws s3 cp apps/desktop/dist/ "${DEST}" \
            --endpoint-url "${ENDPOINT_URL}" \
            --recursive \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.exe" \
            --include "*.AppImage" \
            --include "*.zip" \
            --include "*.deb" \
            --include "*.rpm" \
            --include "*.blockmap"
          aws s3 ls "${DEST}" --endpoint-url "${ENDPOINT_URL}"

      - name: Register all built platforms in edu-server
        shell: bash
        env:
          RELEASE_API_BASE: ${{ secrets.RELEASE_API_BASE }}
          RELEASE_CI_TOKEN: ${{ secrets.RELEASE_CI_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: stable
          BUILD_MATRIX: ${{ needs.prepare.outputs.build_matrix }}
        run: |
          node -e '
            const targets = JSON.parse(process.env.BUILD_MATRIX)
            for (const target of targets) {
              process.stdout.write(`${target.platform}\t${target.arch}\n`)
            }
          ' > "${RUNNER_TEMP}/release-targets.tsv"

          while IFS=$'\t' read -r platform arch; do
            echo "[register] platform=${platform} arch=${arch}"
            PLATFORM="${platform}" ARCH="${arch}" \
              node apps/desktop/scripts/register-release.mjs
          done < "${RUNNER_TEMP}/release-targets.tsv"

  publish-optional-capabilities:
    name: Publish optional Office and depth packages
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.optional_capabilities_only == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate for depth runtime
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          bash apps/desktop/scripts/import-cert-ci.sh
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Build and verify optional capability archives
        shell: bash
        env:
          DEPTH_RUNTIME_CODESIGN_IDENTITY: Developer ID Application
          DEPTH_RUNTIME_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEPTH_RUNTIME_REQUIRE_CODESIGN: '1'
        run: |
          set -euo pipefail
          OFFICE_DIR="${RUNNER_TEMP}/spark-office-viewer-2.2.3-1"
          TARGET_PLATFORM='darwin'
          TARGET_ARCH='arm64'
          DEPTH_DIR="${RUNNER_TEMP}/spark-depth-runtime-${TARGET_PLATFORM}-${TARGET_ARCH}"
          node scripts/prepare-office-viewer-artifact.mjs \
            2.2.3-1 apps/desktop/public/file-viewer "${OFFICE_DIR}"
          node scripts/prepare-depth-runtime-artifact.mjs \
            "${TARGET_PLATFORM}" "${TARGET_ARCH}" 2 "${DEPTH_DIR}" node_modules
          diff -u docs/release-manifests/office-viewer-2.2.3-1.json \
            "${OFFICE_DIR}/office-viewer-2.2.3-1-manifest.json"
          DEPTH_MANIFEST="${DEPTH_DIR}/depth-runtime-4.2.0-1.24.3-2-${TARGET_PLATFORM}-${TARGET_ARCH}-manifest.json"
          node -e '
            const fs = require("node:fs")
            const entry = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            const expected = {
              id: "runtime.optional-depth-transformers-4.2.0-onnx-1.24.3-2-darwin-arm64",
              type: "runtime",
              version: "4.2.0-1.24.3-2",
              platform: "darwin",
              arch: "arm64",
            }
            for (const [key, value] of Object.entries(expected)) {
              if (entry[key] !== value) throw new Error(`unexpected ${key}: ${entry[key]}`)
            }
          ' "${DEPTH_MANIFEST}"
          node --test scripts/__tests__/prepare-office-viewer-artifact.test.mjs \
            scripts/__tests__/prepare-depth-runtime-artifact.test.mjs \
            scripts/__tests__/publish-optional-capabilities-to-minio.test.mjs

      - name: Publish archives and atomically update repository manifest
        shell: bash
        env:
          RELEASE_MINIO_ENDPOINT: ${{ secrets.RELEASE_MINIO_ENDPOINT }}
          RELEASE_MINIO_BUCKET: ${{ secrets.RELEASE_MINIO_BUCKET }}
          RELEASE_MINIO_ACCESS_KEY: ${{ secrets.RELEASE_MINIO_ACCESS_KEY }}
          RELEASE_MINIO_SECRET_KEY: ${{ secrets.RELEASE_MINIO_SECRET_KEY }}
          RELEASE_MINIO_PUBLIC_BASE_URL: https://minio.yiqibyte.com/spark-desktop
          RELEASE_MINIO_ALLOW_INSECURE_HTTP: '1'
        run: |
          set -euo pipefail
          OFFICE_DIR="${RUNNER_TEMP}/spark-office-viewer-2.2.3-1"
          TARGET_PLATFORM='darwin'
          TARGET_ARCH='arm64'
          DEPTH_DIR="${RUNNER_TEMP}/spark-depth-runtime-${TARGET_PLATFORM}-${TARGET_ARCH}"
          node scripts/publish-optional-capabilities-to-minio.mjs \
            "${OFFICE_DIR}/office-viewer-2.2.3-1-manifest.json" \
            "${OFFICE_DIR}/office-viewer-2.2.3-1.tar.gz" \
            "${DEPTH_DIR}/depth-runtime-4.2.0-1.24.3-2-${TARGET_PLATFORM}-${TARGET_ARCH}-manifest.json" \
            "${DEPTH_DIR}/depth-runtime-4.2.0-1.24.3-2-${TARGET_PLATFORM}-${TARGET_ARCH}.tar.gz"
          node scripts/audit-artifact-repository.mjs

      - name: Preserve optional archives for delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: optional-capabilities-macos-arm64
          path: |
            ${{ runner.temp }}/spark-office-viewer-2.2.3-1/*.tar.gz
            ${{ runner.temp }}/spark-depth-runtime-darwin-*/depth-runtime-*.tar.gz
          if-no-files-found: error
          retention-days: 5

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/spark-build.keychain-db" 2>/dev/null || true
