name: Publish Desktop Release

on:
  push:
    branches:
      - master
    paths:
      - apps/desktop/package.json
  # 手动触发：用于调试签名/公证流水线，不用每次 bump version
  workflow_dispatch:
    inputs:
      publish_to_release:
        description: '是否发布到 GitHub Release（关闭则只构建+签名+公证验证，不发布）'
        required: true
        type: boolean
        default: false
      ref:
        description: '构建的分支/tag/commit（默认当前分支）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # 手动触发时支持指定 ref，否则用默认（push 时是 master）
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect version change and ensure release tag exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          # workflow_dispatch 时为 'workflow_dispatch'，push 时为 'push'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch --force --tags
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.ref || github.ref }}" >> "$GITHUB_OUTPUT"

          # 手动触发：直接允许发布，跳过版本变化检测
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "[manual trigger] should_publish=true, version=${VERSION}"
            exit 0
          fi

          # push 触发：检查 version 是否真的变化
          PREV_VERSION=""
          if [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            PREV_VERSION=$(git show "${BEFORE_SHA}:apps/desktop/package.json" 2>/dev/null | node -p "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); raw ? JSON.parse(raw).version ?? '' : ''" || true)
          fi

          if [ -n "${PREV_VERSION}" ] && [ "${PREV_VERSION}" = "${VERSION}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            build_args: --mac --arm64
          - os: macos-latest
            name: mac-x64
            build_args: --mac --x64
          - os: windows-latest
            name: win-x64
            build_args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push 时用 tag；workflow_dispatch 时用输入的 ref（或当前分支）
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop source
        run: pnpm --filter @spark/desktop run build

      # Mac 任务专用：把 Developer ID Application 证书导入临时钥匙串，
      # electron-builder 会自动从钥匙串里发现并签名。
      - name: Import Developer ID certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          bash apps/desktop/scripts/import-cert-ci.sh
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac 签名：electron-builder 会自动发现钥匙串里的 Developer ID 证书。
          # 注意：不在 CI 里用 CSC_LINK 注入签名（已用 import-cert-ci.sh 导入钥匙串），
          # CSC_LINK 这里仅用于公证时回退，实际签名走钥匙串。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # 手动触发时由 workflow_dispatch 输入决定是否发布；push 时默认发布
          PUBLISH_FLAG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_release == 'true') || github.event_name == 'push' }}
        shell: bash
        run: |
          # Windows 签名凭据处理：
          #   - 非 Windows 任务：清理掉，避免污染（Mac 走 CSC_LINK/钥匙串，用不到）。
          #   - Windows 任务但 secret 缺失：必须 unset！否则 GitHub Actions 会把
          #     未配置的 secrets.WIN_CSC_LINK 注入成空字符串，electron-builder 的
          #     chooseNotNull 不把空串当 null，会把空串当证书路径解析，最终
          #     path.resolve(cwd, "") 得到 cwd 本身，报 "Env WIN_CSC_LINK is not
          #     correct, cannot resolve: <cwd> not a file" 直接挂掉构建。
          #     unset 后 process.env.WIN_CSC_LINK 为 undefined，getCscLink 返回 null，
          #     electron-builder 会跳过 Windows 代码签名（产物不签名，但构建能过）。
          if [ "$RUNNER_OS" != "Windows" ] || [ -z "${WIN_CSC_LINK:-}" ] || [ -z "${WIN_CSC_KEY_PASSWORD:-}" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "[publish] ⚠️ 未配置 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD，Windows 产物将不签名（用户安装时会触发 SmartScreen 警告）"
            fi
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export -n WIN_CSC_LINK WIN_CSC_KEY_PASSWORD 2>/dev/null || true
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            security find-identity -v -p codesigning | grep "Developer ID Application"
          fi

          # 根据 PUBLISH_FLAG 决定是否发布到 GitHub Release
          if [ "${PUBLISH_FLAG}" = "true" ]; then
            echo "[publish] 发布到 GitHub Release"
            PUBLISH_OPT="--publish always"
          else
            echo "[publish] 仅构建+签名+公证，不发布到 Release（调试模式）"
            PUBLISH_OPT="--publish never"
          fi

          pnpm --filter @spark/desktop exec electron-builder ${{ matrix.build_args }} ${PUBLISH_OPT}

      # 构建结束后清理钥匙串，避免证书残留在 runner 上（安全最佳实践）
      - name: Cleanup keychain (macOS only)
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/spark-build.keychain-db" 2>/dev/null || true
