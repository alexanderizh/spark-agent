name: Publish Desktop Release

on:
  push:
    branches:
      - master
    paths:
      - apps/desktop/package.json

permissions:
  contents: write

concurrency:
  group: publish-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect version change and ensure release tag exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --force --tags
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v${VERSION}"
          PREV_VERSION=""

          if [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            PREV_VERSION=$(git show "${BEFORE_SHA}:apps/desktop/package.json" 2>/dev/null | node -p "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); raw ? JSON.parse(raw).version ?? '' : ''" || true)
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ -n "${PREV_VERSION}" ] && [ "${PREV_VERSION}" = "${VERSION}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            build_args: --mac --arm64
          - os: macos-latest
            name: mac-x64
            build_args: --mac --x64
          - os: windows-latest
            name: win-x64
            build_args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop source
        run: pnpm --filter @spark/desktop run build

      # Mac 任务专用：把 Developer ID Application 证书导入临时钥匙串，
      # electron-builder 会自动从钥匙串里发现并签名。
      - name: Import Developer ID certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          bash apps/desktop/scripts/import-cert-ci.sh

      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac 签名：electron-builder 会自动发现钥匙串里的 Developer ID 证书。
          # 注意：不在 CI 里用 CSC_LINK 注入签名（已用 import-cert-ci.sh 导入钥匙串），
          # CSC_LINK 这里仅用于公证时回退，实际签名走钥匙串。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          # 仅清理 Windows 相关凭据在非 Windows 任务上，避免污染；
          # Mac 签名/公证凭据必须保留，否则产物未签名会被 Gatekeeper 拦截。
          if [ "$RUNNER_OS" != "Windows" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          pnpm --filter @spark/desktop exec electron-builder ${{ matrix.build_args }} --publish always

      # 构建结束后清理钥匙串，避免证书残留在 runner 上（安全最佳实践）
      - name: Cleanup keychain (macOS only)
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain spark-build.keychain 2>/dev/null || true
