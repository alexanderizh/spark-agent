name: Publish Spark CLI Release

# Spark CLI（spark-engine）发布闭环，全程 GitHub 原生、零外部凭据：
#
#   quality gate → prepare-release → 提交制品到 spark-cli-releases 分支
#   → verify-release 对 raw.githubusercontent.com 公网回读校验。
#
# 触发：push 修改 spark-engine/package.json 或本 workflow；也支持手动触发。
# 制品地址（安装器与 `spark update` 消费的同一 URL 空间）：
#   https://raw.githubusercontent.com/alexanderizh/spark-agent/spark-cli-releases/
#
# 不可变契约：分支上 spark-agent-<version>.tgz 一旦存在即不可覆盖；同名不同
# 字节属于发布事故，工作流会硬失败。latest.json 是唯一可变指针，最后提交。

on:
  push:
    branches:
      - master
    paths:
      - 'spark-engine/package.json'
      - '.github/workflows/publish-spark-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-spark-cli
  cancel-in-progress: false

jobs:
  release:
    name: Prepare, publish to GitHub, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark-engine
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @spark/agent...

      - name: Quality gate (boundary, typecheck, lint, tests, build, package smoke)
        run: npm run verify

      # 质量门通过后生成不可变发布目录（tgz + sha256 sidecar + latest.json + 安装器）。
      - name: Prepare release directory
        run: node scripts/prepare-release.mjs release

      # 把制品平铺到 spark-cli-releases 分支的仓库根（与 DEFAULT_RELEASE_BASE 的
      # raw 直链一一对应）：历史版本全部保留（pinned 安装可回溯），latest.json
      # 是唯一可变指针。推送使用内置 GITHUB_TOKEN，无需 secrets。
      # 注意必须回到仓库根执行 git/cp——留在 spark-engine 子目录会把整库带上分支。
      - name: Publish artifacts to the spark-cli-releases branch
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          set -x
          # 校验脚本随分支切换会被清掉，先存到 runner 临时目录供下个步骤使用。
          mkdir -p "$RUNNER_TEMP/spark-verify"
          cp spark-engine/scripts/verify-release.mjs \
             spark-engine/scripts/release-contract.mjs \
             "$RUNNER_TEMP/spark-verify/"
          VERSION="$(node -p "require('./spark-engine/package.json').version")"
          TARBALL="spark-agent-${VERSION}.tgz"
          test -f "spark-engine/release/${TARBALL}"

          git config user.name 'spark-release-bot'
          git config user.email 'actions@github.com'
          if git ls-remote --exit-code --heads origin spark-cli-releases >/dev/null 2>&1; then
            git fetch origin spark-cli-releases
            git checkout -B spark-cli-releases origin/spark-cli-releases
          else
            git checkout --orphan spark-cli-releases
            git rm -rfq . || true
          fi

          # 远端是否已有该版本：必须在 cp 覆盖工作区之前判定，否则全新版本的
          # 制品一落地就会误命中"同版本重跑"分支（v0.3.0 曾因此把 latest.json
          # 回滚成旧指针，渠道永远停在上一个版本）。
          REMOTE_HAS_TARBALL=false
          if [ -f "$TARBALL" ]; then REMOTE_HAS_TARBALL=true; fi

          cp -f spark-engine/release/* .

          # 同版本幂等：releases 分支上若该版本已存在，则以远端为准保留原字节
          # （不同环境的 npm 包不是字节确定的），只清掉本次本地重打包的拷贝；
          # 全新版本则让刚拷贝的最新指针原样提交。这样质量门/发版的重复触发
          # 永远收敛为绿色；真正的防篡改由安装器与 `spark update` 在下载时的
          # 全量 SHA-256 校验承担。
          if [ "$REMOTE_HAS_TARBALL" = true ]; then
            git checkout -- "$TARBALL" "${TARBALL}.sha256" 2>/dev/null || true
            # 该版本的 latest.json 以 checkout 时刻的远端内容为权威：
            # 必须读 HEAD，而不是已被 cp 覆盖的工作区文件（自己和自己比）。
            remote_pointer_version="$(git show "HEAD:latest.json" | node -e '
              let data = "";
              process.stdin.on("data", (chunk) => { data += chunk });
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(data).version ?? "") }
                catch { process.stdout.write("") }
              });
            ')"
            if [ "$remote_pointer_version" = "$VERSION" ]; then
              git checkout -- latest.json 2>/dev/null || true
            fi
          fi

          # 终局断言：提交前的 latest.json 必须指向本次发布的版本，否则宁可
          # 红灯——v0.3.0 曾因指针被回滚成旧版本而"绿灯发布旧渠道"。
          pointer_version="$(node -p "JSON.parse(require('fs').readFileSync('latest.json','utf8')).version")"
          if [ "$pointer_version" != "$VERSION" ]; then
            echo "::error::latest.json 指针版本(${pointer_version})与发布版本(${VERSION})不一致，拒绝提交"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo '::notice::发布分支已是目标状态，无内容需要提交。'
          else
            # --no-verify：此提交/推送发生在 orphan 分支清空工作区之后，本地开发者的
            # pre-commit/commit-msg/pre-push 钩子（simple-git-hooks 安装于 .git/hooks，
            # 其引用的 scripts/ 已被 git rm 清掉）必然 MODULE_NOT_FOUND。
            git commit -q --no-verify -m "release(spark-cli): v${VERSION}"
            # 推送重试：runner 到远端偶发 HTTP 408/断连（v0.4.0 发布曾因瞬态
            # 408 红灯）；ref 推送幂等，若首次实际已生效，重试只会报
            # Everything up-to-date，安全。
            pushed=0
            for attempt in 1 2 3; do
              if git push --no-verify origin HEAD:spark-cli-releases; then
                pushed=1
                break
              fi
              echo "::warning::推送第 ${attempt}/3 次失败，退避后重试。"
              sleep $((attempt * 15))
            done
            if [ "$pushed" -ne 1 ]; then
              echo '::error::推送 spark-cli-releases 连续 3 次失败。'
              exit 1
            fi
          fi

      # 公网回读校验与安装器/更新器处于同一 URL 空间；raw CDN 缓存有延迟，
      # 本步骤因此内置 6x30 秒重试窗口。
      - name: Verify published release over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/alexanderizh/spark-agent/spark-cli-releases'
          for attempt in 1 2 3 4 5 6; do
            # 纯远端校验：latest.json schema、tarball 字节哈希、sidecar 与安装器齐全。
            if node "$RUNNER_TEMP/spark-verify/verify-release.mjs" --base "$BASE"; then
              exit 0
            fi
            echo "::warning::第 ${attempt}/6 次公网校验未通过（可能是 raw CDN 缓存延迟），30 秒后重试。"
            sleep 30
          done
          echo '::error::公网校验在重试窗口内仍未通过。'
          exit 1

      - name: Upload prepared release as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-cli-release-${{ github.sha }}
          path: |
            spark-engine/release/*.tgz
            spark-engine/release/*.sha256
            spark-engine/release/latest.json
            spark-engine/release/install.sh
            spark-engine/release/install.ps1
            spark-engine/release/install.cmd
          retention-days: 5
