name: Publish Spark CLI Release

# Spark CLI（spark-engine）发布闭环，全程 GitHub 原生、零外部凭据：
#
#   quality gate → prepare-release → 提交制品到 spark-cli-releases 分支
#   → verify-release 对 raw.githubusercontent.com 公网回读校验。
#
# 触发：push 修改 spark-engine/package.json 或本 workflow；也支持手动触发。
# 制品地址（安装器与 `spark update` 消费的同一 URL 空间）：
#   https://raw.githubusercontent.com/alexanderizh/spark-agent/spark-cli-releases/
#
# 不可变契约：分支上 spark-agent-<version>.tgz 一旦存在即不可覆盖；同名不同
# 字节属于发布事故，工作流会硬失败。latest.json 是唯一可变指针，最后提交。

on:
  push:
    branches:
      - master
    paths:
      - 'spark-engine/package.json'
      - '.github/workflows/publish-spark-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-spark-cli
  cancel-in-progress: false

jobs:
  release:
    name: Prepare, publish to GitHub, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'spark-engine/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (boundary, typecheck, lint, tests, build, package smoke)
        run: npm run verify

      # 质量门通过后生成不可变发布目录（tgz + sha256 sidecar + latest.json + 安装器）。
      - name: Prepare release directory
        run: node scripts/prepare-release.mjs release

      # 把制品平铺到 spark-cli-releases 分支：历史版本全部保留（pinned 安装可回溯），
      # latest.json 作为唯一可变指针最后提交。推送使用内置 GITHUB_TOKEN，无需 secrets。
      - name: Publish artifacts to the spark-cli-releases branch
        shell: bash
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="spark-agent-${VERSION}.tgz"
          test -f "release/${TARBALL}"

          git config user.name 'spark-release-bot'
          git config user.email 'actions@github.com'
          git fetch origin spark-cli-releases || true
          if git ls-remote --exit-code --heads origin spark-cli-releases >/dev/null 2>&1; then
            git checkout -B spark-cli-releases origin/spark-cli-releases
          else
            git checkout --orphan spark-cli-releases
            git rm -rf . -q || true
          fi

          # 不可变契约：同版本已存在时字节必须一致（最新 sha256 sidecar 为准）。
          if [ -f "${TARBALL}.sha256" ]; then
            old="$(cut -d' ' -f1 <"${TARBALL}.sha256" | head -n1)"
            new="$(cut -d' ' -f1 <release/"${TARBALL}".sha256 | head -n1)"
            if [ "$old" != "$new" ]; then
              echo "::error::${TARBALL} 已以不同内容发布过（$old ≠ $new）；请升版本号后重试。"
              exit 1
            fi
          fi

          cp -f release/* .
          git add -A
          if git diff --cached --quiet; then
            echo '::notice::发布分支已是目标状态，无内容需要提交。'
          else
            git commit -q -m "release(spark-cli): v${VERSION}"
            git push origin HEAD:spark-cli-releases
          fi

      # 公网回读校验与安装器/更新器处于同一 URL 空间；raw CDN 缓存有延迟，
      # 本步骤因此内置 6x30 秒重试窗口。
      - name: Verify published release over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/alexanderizh/spark-agent/spark-cli-releases'
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-release.mjs release --base "$BASE"; then
              exit 0
            fi
            echo "::warning::第 ${attempt}/6 次公网校验未通过（可能是 raw CDN 缓存延迟），30 秒后重试。"
            sleep 30
          done
          echo '::error::公网校验在重试窗口内仍未通过。'
          exit 1

      - name: Upload prepared release as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-cli-release-${{ github.sha }}
          path: |
            spark-engine/release/*.tgz
            spark-engine/release/*.sha256
            spark-engine/release/latest.json
            spark-engine/release/install.sh
            spark-engine/release/install.ps1
            spark-engine/release/install.cmd
          retention-days: 5
