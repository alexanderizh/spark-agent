<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="安全与密钥边界：密钥明文被拒、受保护表单进凭据库、六级作用域合并注入与全程日志脱敏">
  <defs>
    <style>
      text { font-family: 'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
      .fig { fill: #ffffff; }
      .h1 { font-size: 19px; font-weight: 700; fill: #10162f; }
      .sub { font-size: 12.5px; fill: #6675a3; }
      .band { font-size: 12px; font-weight: 600; fill: #10162f; }
      .tt { font-size: 12px; font-weight: 600; fill: #10162f; }
      .st { font-size: 11px; fill: #33415c; }
      .bd { font-size: 10.5px; fill: #465789; }
      .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #ccd5e6; stroke-width: 1; }
      .soft { fill: #f5f7ff; stroke: #ccd5e6; stroke-width: 1; }
      .div { stroke: #dde3f1; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .fig { fill: #15171c; }
        .h1 { fill: #e9ebf1; } .tt { fill: #e9ebf1; } .band { fill: #e9ebf1; } .sub { fill: #8b93a6; }
        .st { fill: #c3cad8; } .bd { fill: #aab2c3; }
        .card { fill: #1b1e26; stroke: #384050; }
        .soft { fill: #191c23; stroke: #384050; }
        .div { stroke: #2f3644; }
      }
    </style>
  </defs>
  <rect class="fig" x="0" y="0" width="960" height="660"/>

  <text class="h1" x="40" y="38">安全与密钥 · 一枚密钥的受控旅程</text>
  <text class="sub" x="40" y="60">密钥永不经过 Agent 参数与聊天记录：明文直接被拒，只走受保护表单进系统凭据库；调用时按六级作用域合并注入，全程日志脱敏</text>
  <line class="div" x1="40" y1="76" x2="920" y2="76"/>

  <text class="band" x="40" y="100">① 密钥主链路：从声明到注入</text>
  <line class="div" x1="60" y1="126" x2="60" y2="458"/>

  <circle cx="60" cy="134" r="13" fill="#5b6cff"/><text class="num" x="60" y="139" text-anchor="middle">1</text>
  <rect class="card" x="84" y="112" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="139">manifest 声明变量：secret: true 禁止默认值；agentConfigurable 控制 Agent 配置权</text>

  <circle cx="60" cy="186" r="13" fill="#f59e0b"/><text class="num" x="60" y="191" text-anchor="middle">2</text>
  <rect class="card" x="84" y="164" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="191">Agent 直接传密钥值被拒（requires secure input）；未授权变量同样拒绝</text>

  <circle cx="60" cy="238" r="13" fill="#5b6cff"/><text class="num" x="60" y="243" text-anchor="middle">3</text>
  <rect class="card" x="84" y="216" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="243">改走一次性安全输入请求（TTL 1–60 分钟），用户在受保护表单中填写</text>

  <circle cx="60" cy="290" r="13" fill="#5b6cff"/><text class="num" x="60" y="295" text-anchor="middle">4</text>
  <rect class="card" x="84" y="268" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="295">值只进系统凭据库（Keychain vault + safeStorage 加密），库表仅存 keystore_ref</text>

  <circle cx="60" cy="342" r="13" fill="#5b6cff"/><text class="num" x="60" y="347" text-anchor="middle">5</text>
  <rect class="card" x="84" y="320" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="347">调用时按六级作用域合并：session &gt; workflow &gt; agent &gt; project &gt; tool &gt; package</text>

  <circle cx="60" cy="394" r="13" fill="#5b6cff"/><text class="num" x="60" y="399" text-anchor="middle">6</text>
  <rect class="card" x="84" y="372" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="399">子进程白名单继承：仅 PATH 等 10 条宿主变量 + 合并配置值 + SPARK_* 元信息</text>

  <circle cx="60" cy="446" r="13" fill="#16a34a"/><text class="num" x="60" y="451" text-anchor="middle">7</text>
  <rect class="card" x="84" y="424" width="476" height="44" rx="8"/>
  <text class="st" x="100" y="451">出口三重脱敏：统一日志 [redacted]、子进程回传帧 [REDACTED]、hook 摘要 ***</text>

  <text class="band" x="580" y="100">② 三个关键机制</text>

  <rect class="soft" x="580" y="112" width="340" height="132" rx="10"/>
  <text class="tt" x="600" y="140">六级作用域覆盖</text>
  <text class="bd" x="600" y="164">package → tool → project → agent → workflow → session</text>
  <text class="bd" x="600" y="184">同名变量按此序逐层覆盖，session 层最终胜出</text>
  <text class="bd" x="600" y="204">只保留 manifest 声明过的变量名</text>
  <text class="bd" x="600" y="224">required 变量缺失直接抛错，不静默降级</text>

  <rect class="soft" x="580" y="256" width="340" height="152" rx="10"/>
  <text class="tt" x="600" y="284">项目 / 会话 customEnv</text>
  <text class="bd" x="600" y="308">会话级覆盖项目级，注入引擎与 Bash 子进程</text>
  <text class="bd" x="600" y="328">疑似密钥名默认过滤，显式配置的变量才放行</text>
  <text class="bd" x="600" y="348">掩码变量清单注入系统提示词，Agent 用 $KEY 引用</text>
  <text class="bd" x="600" y="368">而非明文重述；env 不同的配置派生不同常驻子进程</text>

  <rect class="soft" x="580" y="420" width="340" height="140" rx="10"/>
  <text class="tt" x="600" y="448">hooks 双轨</text>
  <text class="bd" x="600" y="472">桌面 V2：7 个观察型事件，通知 / 声音 / 工具动作</text>
  <text class="bd" x="600" y="492">outbox → dispatcher → 短租约 worker，失败不回灌主流程</text>
  <text class="bd" x="600" y="512">spark-engine：PreToolUse 等四事件可拦截</text>
  <text class="bd" x="600" y="532">退出码 2 或 decision:block 拦截；approve 跳过权限询问</text>

  <rect class="soft" x="40" y="580" width="880" height="52" rx="10"/>
  <text class="bd" x="60" y="602" font-size="11">secretRefs 硬校验：敏感头禁止明文模板；sk- / AKIA / ghp_ / PEM 等 7 种密钥形态保存即拒。</text>
  <text class="bd" x="60" y="620" font-size="11">密钥明文只存在于用户表单与系统凭据库之间：声明、输入、存储、注入、脱敏全程受控。</text>
</svg>
