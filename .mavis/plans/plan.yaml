      1. **代码验证**：
         - 进入 /Users/zhangyang/spark_ai_project/Spark-Agent
         - 运行 `pnpm -C apps/desktop tsc --noEmit` 通过
         - 运行 `pnpm -C apps/desktop build` 通过
         - **确认** ExportPayload schema 包含 version 字段
         - **确认** apiKey 不在导出字段中（grep "apiKey" 在 export 相关代码应只
