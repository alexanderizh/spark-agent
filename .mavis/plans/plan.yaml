version: 1
plan:
  name: 'Provider 配置中心重构 - 独立菜单 + 表单 UI 重做 + 导入导出 + 新供应商模板'
  max_concurrency: 4
  max_consecutive_failures: 2
  max_cycles: 8
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0

tasks:
  # =========================================================================
  # Phase 1 — 并行：数据 + 导航（无相互依赖）
  # =========================================================================

  - id: data-and-icons
    title: '扩充供应商模板库 + 真实 Logo 图标资产'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      你是 Spark-Agent 项目的 Coder。本任务独立完成"数据 + 资产"层工作，为后续 UI
      重构准备基础素材，不涉及任何 UI 改动。

      ## 工作目录
      /Users/zhangyang/spark_ai_project/Spark-Agent

      ## 必读
      - packages/protocol/src/provider-presets.ts — 现有供应商元数据与预设
      - apps/desktop/src/renderer/assets/ — 现有 assets 目录
      - apps/desktop/src/main/ipc/index.ts — 现有 provider:* IPC 通道（仅作参考）

      ## 当前数据快照
      现有 13 个 vendor：OpenAI、Anthropic、Google Gemini、腾讯云 Coding Plan、阿里云
      百炼 Coding Plan、智谱 GLM Coding Plan、通义千问、DeepSeek、MiniMax、Kimi、
      硅基流动、OpenRouter、Ollama。每个 vendor 至少有 1-2 个 preset（anthropic 或
      openai 协议）。

      ## 任务目标
      1. **新增 14+ 个 vendor 模板**，按用户要求和参考站 https://coding.mcppla.net/
         列举的平台补全。**至少**包含：
         - 小米 mimo（xfamily/xiaomi-mimo）
         - 讯飞星辰（xfyun）
         - 京东云 JoyBuilder（jdcloud）
         - 天翼云（telecom/ctyun，中国电信，注意用户说的是"电信"）
         - 百度千帆（baidu）
         - 火山方舟 Coding Plan（volcengine，字节跳动）
         - 华为云（huaweicloud）
         - 联通云（unicom）
         - UCloud（ucloud）
         - 无问芯穹 Infini-AI（infini-ai）
         - Alaya Code 九章云极（alaya）
         - 摩尔线程（mthreads）
         - 快手（kuaishou）
         - Trae（trae，字节）
         - 阿里通义（qwen-tongyi，已有则合并）

         不要再增 DeepSeek/MiniMax/Kimi/GLM 等已有 vendor（除非真的需要补格式）。

      2. **每个新 vendor** 至少 1 个 preset（如果同时支持 Anthropic 和 OpenAI 双协议
         则两个 preset），字段同 ProviderPreset 现有结构：
         - id、vendorId、name、provider (anthropic|openai)、apiEndpoint、defaultModel
         - modelIds（基于各家官方文档的当前旗舰模型，至少 3-5 个真实存在的模型 ID）
         - sourceUrls（官方文档 URL，至少 1 个）

      3. **更新 VendorMeta 接口**，新增 `logoPath: string` 字段（指向
         `apps/desktop/src/renderer/assets/providers/<id>.svg`），同时保留 `emoji`、
         `color`、`desc` 字段不变以便回退。

      4. **下载真实 Logo 图标**到 `apps/desktop/src/renderer/assets/providers/` 目录：
         - 格式：SVG 优先（矢量化清晰），PNG 次之（至少 128x128）
         - 来源：各家官网 favicon、品牌资源页、或 https://coding.mcppla.net/ 站内
           可能用到的资源
         - 命名：`<vendorId>.svg` 或 `.png`，小写连字符
         - 所有 vendor 都必须有自己的 logo 文件（含现有 13 个）
         - 如果实在找不到的，**降级**到清晰的字母/图形 SVG（用代码生成，
           在文件中标 TODO 等用户后续替换）
         - 文件大小：单个 < 50KB

      5. **校验**：
         - pnpm -C apps/desktop tsc --noEmit 不能有新增 TS 错误
         - PROVIDER_PRESETS 数组用 TS 字符串模板验证每个 vendorId 都有 logo 文件
         - 加一个简单的自检函数 `assertProviderAssetsConsistency()` 在
           provider-presets.ts 末尾，dev 模式下能用 `window` 触发；这个函数不
           强制 import fs，避免 protocol 包耦合 node。

      ## 约束
      - **不要改**任何 UI 文件（views/、components/、styles/、App.tsx、AppContext.tsx）
      - **不要改**packages/protocol/src/index.ts 之外的其他 protocol 文件
      - logo 资产不要污染 git 大的二进制——SVG 优先
      - 模型 ID 必须真实（可以查 https://docs.anthropic.com 、
        https://platform.openai.com/docs/models 、https://help.aliyun.com/zh/model-studio、
        https://www.volcengine.com/docs 等官方文档），不要编造
      - 复用现有 VENDOR_CATALOG 风格（id 小写、name 友好、emoji 简短、color 品牌色）

      ## 交付物
      - 修改/新增的 provider-presets.ts
      - 新增到 apps/desktop/src/renderer/assets/providers/ 的所有 logo 文件
      - 在工作目录写 deliverable.md，列出：
        * 新增 vendor 总数
        * 新增 preset 总数
        * logo 文件清单（vendorId → 文件路径 → 大小）
        * 任何降级到字母 logo 的 vendor（标 TODO）
        * tsc 输出结果
    verify_prompt: |
      你是 Verifier。**不要重读 producer 的描述**。独立完成以下验证：

      1. **代码验证**：
         - 进入 /Users/zhangyang/spark_ai_project/Spark-Agent
         - 运行 `pnpm -C packages/protocol tsc --noEmit` 不应有新错误
         - 运行 `pnpm -C apps/desktop tsc --noEmit` 不应有新错误
         - 读 packages/protocol/src/provider-presets.ts，统计：
           * VENDOR_CATALOG 至少 27 个（13 旧 + 14 新）
           * PROVIDER_PRESETS 至少有 35 个 preset
           * 每个新 vendor 都有 logoPath 字段

      2. **资产验证**：
         - 列目录 apps/desktop/src/renderer/assets/providers/
         - 至少有 27 个文件
         - 每个文件 size > 0 且 < 100KB
         - 至少 80% 是 SVG（用 `file <path>` 验证）
         - 抽查 3 个文件的 SVG 内容确实包含品牌可识别元素（而不是 placeholder）

      3. **数据真实性抽查**：
         - 抽 3 个新 vendor（如 火山方舟 / 讯飞星辰 / 小米 mimo）
         - 用 webfetch 访问其官方 API 文档页
         - 验证 defaultModel 和至少 1 个 modelId 是真实存在的
         - 验证 apiEndpoint 域名真实

      4. **范围检查**：
         - `git diff --name-only` 不应包含 views/、components/、styles/、
           App.tsx、AppContext.tsx
         - `git diff --stat packages/protocol/src/provider-presets.ts` 应该是
           一个合理范围的大变更

      输出 PASS/FAIL。FAIL 时具体到：
      - 哪个 vendor 的 logo 缺失/无效
      - 哪个 model ID 查不到
      - 哪个 TS 错误未修
      - 哪些文件越界修改

  - id: nav-and-shell
    title: '菜单结构重构 + 抽出独立 ProvidersView'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      你是 Spark-Agent 项目的 Coder。本任务只做"导航 + 视图结构"调整，**不要
      修改** ProviderEditPanel 的具体 UI（那是后续 task 的事），**不要修改**
      provider-presets.ts（那是 data-and-icons 的事）。

      ## 工作目录
      /Users/zhangyang/spark_ai_project/Spark-Agent

      ## 必读
      - apps/desktop/src/renderer/App.tsx — 主壳，侧边栏入口在这
      - apps/desktop/src/renderer/design/AppContext.tsx — Tweaks 类型 + ViewId
      - apps/desktop/src/renderer/design/views/SettingsView.tsx — 当前 Provider
        功能嵌在 ProvidersSection 里
      - apps/desktop/src/renderer/design/views/overlays.tsx — CommandPalette

      ## 任务目标
      1. **抽出 ProvidersView 独立文件**
         - 新建 apps/desktop/src/renderer/design/views/ProvidersView.tsx
         - 从 SettingsView.tsx 把以下函数移过来：
           * ProvidersSection 主体
           * ProviderEditPanel export
           * VendorPresetCard（private）
           * ProviderCardX（private）
           * normalizeProviderKind、parseModelIds、joinModelIds（private）
           * ProviderKind、ProviderForm 类型
         - ProvidersView 导出一个 default 组件 + 单独导出 ProviderEditPanel
           （SettingsView 里可能还有引用，要保持兼容）

      2. **改 AppContext.tsx**
         - ViewId 加 'providers'
         - DEFAULT_TWEAKS.view 默认值保持 'chat' 不变
         - settingsSection 字段保留，但 ProvidersView 不用它

      3. **改 App.tsx**
         - 侧边栏导航：删除 Settings 区块的那个 Providers 入口（如有），
           **新增**一个一级菜单入口"Providers"，放在 Settings 按钮**之上**，
           用现有 Icons.Cloud 或 Icons.Server 之类的合适图标
         - ViewMap 加 providers: ProvidersView
         - viewMeta（ViewHeader）加 providers: { title: 'Providers',
           sub: '模型供应商与协议配置' }

      4. **改 SettingsView.tsx**
         - 删除 ProvidersSection 整个函数
         - 删除 nav 里的 providers 项
         - 删除 normalizeProviderKind、parseModelIds、joinModelIds、ProviderKind、
           ProviderForm 类型（已移到 ProvidersView）
         - 删除对 ProviderEditPanel、VendorPresetCard、ProviderCardX 的引用
         - 删除未使用的 imports（ProviderPreset, getProviderPresetById,
           getPresetsByVendor, getUniqueVendorIds, getVendorMeta,
           PROVIDER_PRESETS, VENDOR_CATALOG, VendorMeta 等）
         - 保留 ProfileEditModal 等其他部分

      5. **改 CommandPalette（overlays.tsx）**
         - 在 navigate 选项里加 providers 跳转支持（如有相关配置）
         - 如支持搜索跳转，'Providers' 应能搜出来

      6. **校验**：
         - pnpm -C apps/desktop tsc --noEmit 必须通过
         - pnpm -C apps/desktop build 或 vite build 不能有错
         - 启动 dev server 主进程无 console 错

      ## 约束
      - **不要改** ProviderEditPanel 的 UI 内容（即使有问题，先只做"搬家"）
      - **不要改** provider-presets.ts
      - **不要新增**功能，只做结构性重组
      - 所有 export 名字保持兼容（其他文件可能 import）
      - 改完后运行 git status 确认范围

      ## 交付物
      - 新增 apps/desktop/src/renderer/design/views/ProvidersView.tsx
      - 修改 App.tsx、AppContext.tsx、SettingsView.tsx、overlays.tsx
      - deliverable.md 列出：
        * 新增/修改/删除的文件
        * 关键 API 变更（如果 ViewId 加了 'providers' 算 breaking，写明）
        * tsc 与 build 输出
        * 主进程启动 smoke check 结果
    verify_prompt: |
      你是 Verifier。**独立验证**导航重构：

      1. **代码验证**：
         - 读 apps/desktop/src/renderer/design/views/ProvidersView.tsx 存在
           且包含 ProvidersSection、ProviderEditPanel 导出
         - 读 SettingsView.tsx，**确认**不再包含 providers 相关的 nav 项
           和 ProviderEditPanel/VendorPresetCard 实现
         - 读 App.tsx，**确认**侧边栏有一级菜单 'Providers'，位置在 Settings **之上**
         - 读 AppContext.tsx，**确认** ViewId 联合类型包含 'providers'
         - 运行 `pnpm -C apps/desktop tsc --noEmit` 通过
         - 运行 `pnpm -C apps/desktop build` 通过（如果环境支持）

      2. **运行时验证**（如果能跑起 dev server）：
         - 主进程启动后无 console 错误
         - 切到 Providers 视图能渲染（不要求完整功能，只要求不崩）

      3. **回归检查**：
         - 搜索 `ProviderEditPanel` 的 import，确认 SettingsView 不再 import，
           ProvidersView 是新的 import 源
         - 搜索 `ProvidersSection` 不应在 SettingsView 中
         - 搜索 `getProviderPresetById`、`getVendorMeta` 在 SettingsView 不应出现

      4. **范围检查**：
         - `git diff --stat` 不应包含 packages/、components/、styles/、
           任何 UI 内容细节（只允许结构性调整）

      输出 PASS/FAIL。FAIL 时具体到：
      - 哪个文件没改干净
      - 哪个 tsc/build 错误
      - 哪个 import 残留
      - 哪个位置不对（菜单顺序、view id 等）

  # =========================================================================
  # Phase 2 — 并行：UI 重做 + 导入导出（依赖 Phase 1 的两项）
  # =========================================================================

  - id: provider-form-ui
    title: 'Provider 表单 UI/UX 全面重做（chip 模型列表 + 真实 logo + C 端视觉）'
    assigned_to: coder
    verified_by: verifier
    depends_on: [data-and-icons, nav-and-shell]
    timeout_ms: 1800000
    prompt: |
      你是 Spark-Agent 项目的 Coder。本任务**只**重做 Provider 编辑表单的 UI/UX，
      不改 nav 结构和数据层，导入导出功能在另一个 task（import-export）里做。

      ## 工作目录
      /Users/zhangyang/spark_ai_project/Spark-Agent

      ## 必读
      - apps/desktop/src/renderer/design/views/ProvidersView.tsx — ProviderEditPanel
        当前实现（要改的对象）
      - apps/desktop/src/renderer/design/components/FormControls.tsx — SparkInput、
        SparkSelect 当前实现
      - apps/desktop/src/renderer/design/styles/styles.css — 现有 spark-input 样式
      - apps/desktop/src/renderer/design/styles/views.css — 现有 provider-card、
        preset-catalog 样式
      - apps/desktop/src/renderer/assets/providers/ — 真实 logo 资源
      - user 提供的截图：当前表单"显示名称"、"默认模型 ID"输入框**没框**、
        **左右内边距不足**、可用模型是 textarea 多行文本

      ## 任务目标
      1. **修复输入框样式问题**（针对 .form-grid 内所有输入控件）
         - 所有输入/下拉/textarea 必须有明显边框（不能裸 background）
         - 高度统一 ≥ 36px（C 端标准）
         - 左右内边距 ≥ 12px（当前 10px 太小）
         - 焦点态更明显（ring + 颜色）
         - 如果用的是原生 textarea 而非 SparkInput，要么换成 SparkInput，
           要么给 textarea 应用 .spark-input 同样的样式类
         - 修完后用户截图里那种"看不见框"的输入框要能看到清晰边框

      2. **可用模型列表：textarea → chip 列表**
         - 现有是 `<textarea rows={4}>` 一行一个模型 ID
         - 改成：input + 按钮添加 + 已添加模型的 chip（可删除）+ 整体卡片
         - 交互：
           * 输入框 + 右侧"添加"按钮，按 Enter 或点击按钮添加
           * 已有模型渲染为 chip 列表，每个 chip 右侧有 X 删除
           * 默认模型 ID 字段需要单独标记（高亮、不可删除、加星标）
           * 空状态有友好提示
         - 表单 modelIdsText 字段（textarea 用）可以保留为内部 state 用于 export 兼容
         - chip 数量 > 6 时 chip 区域可滚动

      3. **真实 Logo 集成**
         - 供应商模板下拉框的 option 前展示 logo（用 emoji 文字不够好）
         - 选中后 header 的 h-icon 用真实 logo
         - 模板目录卡片（VendorPresetCard）用真实 logo 替代 emoji
         - 已配置的 Provider 卡片（ProviderCardX）用真实 logo
         - 用 `<img src={logoPath} />` 渲染 SVG，失败时 fallback 到 emoji 文字

      4. **C 端 UI/UX 整体优化**
         - 顶部 hero 区更突出：title + logo + 副标题（协议 + 鉴权方式）排版
         - 表单分组用卡片包裹，hover/focus 视觉提示
         - 错误提示用 banner 而非 inline
         - 主要按钮主色一致（C 端风格）
         - 间距统一（4/8/12/16/24px 网格）
         - 暗色模式（theme-dark）下也好看

      5. **保留**：
         - 现有数据流（useIpcInvoke、handleSave、preset 切换）
         - 现有 IPC 协议
         - 现有 props（profileId、initialPresetId、onClose）
         - parseModelIds、joinModelIds 工具函数

      6. **新增** （仅 UI 层面的辅助）：
         - 如果必要，新建 apps/desktop/src/renderer/design/components/ChipList.tsx
           组件（封装 chip 添加/删除）
         - 如果必要，新建 apps/desktop/src/renderer/design/components/ProviderLogo.tsx
           组件（统一处理 logo + fallback）

      7. **校验**：
         - pnpm -C apps/desktop tsc --noEmit 通过
         - pnpm -C apps/desktop build 通过
         - 用 playwright 截图主要视图（如果环境允许）确认视觉无 regression

      ## 约束
      - **不要改** provider-presets.ts（数据是 data-and-icons 的产物）
      - **不要改** IPC 协议
      - **不要改** App.tsx 导航（那是 nav-and-shell 的产物）
      - **不要碰**导入导出 UI（那是 import-export 的产物）
      - 改动范围限制在 ProvidersView.tsx、FormControls.tsx（如需扩展）、
        新增的 ChipList/ProviderLogo 组件、相关 styles.css
      - 保留中文标签和注释

      ## 交付物
      - 修改 ProvidersView.tsx（核心）
      - 可能新增 components/ChipList.tsx、components/ProviderLogo.tsx
      - 修改 styles.css 或 views.css 增补 chip 列表、输入框样式
      - deliverable.md 列出：
        * 改动的样式/组件清单
        * 视觉对比（before/after 描述）
        * tsc/build 输出
        * 任何遗留的 polish 建议
    verify_prompt: |
      你是 Verifier。**独立验证**表单 UI 重做，重点看视觉和交互：

      1. **代码验证**：
         - 进入 /Users/zhangyang/spark_ai_project/Spark-Agent
         - 运行 `pnpm -C apps/desktop tsc --noEmit` 通过
         - 运行 `pnpm -C apps/desktop build` 通过
         - 读 ProvidersView.tsx，**确认**：
           * 可用模型字段**不再**用 `<textarea>` 渲染
           * 使用了 chip 列表模式（grep 关键词 "chip"、"Chip"）
         - 读 styles.css，**确认**新增了 chip 样式 + 输入框 padding 调整
         - 真实 logo 集成：grep `<img` + `assets/providers/` 出现至少 3 处

      2. **CSS 验证**（**这是用户截图的核心痛点**）：
         - 读 .spark-input、.form-grid > .spark-input 相关样式
         - **确认** padding 至少 12px（用户截图的"左右内边距不足"问题）
         - **确认** border 存在且在所有状态都可见
         - 读 textarea 相关样式（如果还在用），padding 也要 ≥ 12px

      3. **运行时验证**（如果 dev server 跑得起）：
         - 用 playwright 打开主界面
         - 切到 Providers 视图
         - 截图 providers-list 页面
         - 点击"从模板添加" → 截图 preset-catalog 页面
         - 点击"自定义添加" → 截图 add-provider 表单页面
         - 输入框必须**有清晰边框**（不是裸 background）
         - 可用模型区域必须有 input + 添加按钮 + chip 列表三件套
         - 验证截图保存到 deliverable 路径供用户参考

      4. **功能回归**：
         - 选择模板后表单字段应自动填充
         - chip 添加（输入 + Enter）应能加到列表
         - chip 删除应能移除
         - 默认模型 ID 字段单独存在
         - API Key 留空在编辑模式下不更新

      输出 PASS/FAIL。FAIL 时具体到：
      - 哪个输入框没框
      - 哪个 padding 还不够
      - 哪个 chip 交互失效
      - 哪个 logo fallback 没生效
      - 截图证据（如有）

  - id: import-export
    title: 'Provider 导入导出功能（多选 + JSON 序列化 + 文件 IO）'
    assigned_to: coder
    verified_by: verifier
    depends_on: [data-and-icons, nav-and-shell]
    timeout_ms: 1800000
    prompt: |
      你是 Spark-Agent 项目的 Coder。本任务**只**做 Provider 配置的导入导出功能。
      表单 UI 重做是另一个 task 的事，但你可能需要在新 UI 上加导入导出按钮。

      ## 工作目录
      /Users/zhangyang/spark_ai_project/Spark-Agent

      ## 必读
      - apps/desktop/src/renderer/design/views/ProvidersView.tsx — 视图主体
      - apps/desktop/src/main/ipc/index.ts — 现有 provider:list/create/update/delete/health-check
      - apps/desktop/src/preload/ — 现有 IPC 类型定义
      - apps/desktop/src/main/services/ — 现有 provider service
      - packages/protocol/src/ — 协议层（你可能要在 protocol 包加 export/import 类型）

      ## 任务目标

      ### 后端
      1. **新增 IPC 通道**：
         - `provider:export` — 入参 `{ ids: string[] }`，返回 `{ payload: ExportPayload }`
         - `provider:import` — 入参 `{ payload: ExportPayload, mode: 'merge' | 'replace' }`，
           返回 `{ imported: number, skipped: number, errors: string[] }`
         - `provider:export-to-file` — 入参 `{ ids: string[] }`，弹出系统保存对话框，
           写入 .json 文件，返回 `{ filePath: string }`
         - `provider:import-from-file` — 弹出系统打开对话框，读 JSON 解析，返回 payload

      2. **ExportPayload schema**（versioned）：
         ```ts
         {
           version: 1,
           exportedAt: string (ISO 8601),
           exportedBy: 'spark-agent',
           profiles: Array<{
             id: string,           // 源 id（导入时去重用）
             name: string,
             provider: 'anthropic' | 'openai',
             apiEndpoint: string | null,
             defaultModel: string,
             modelIds: string[],
             supportsMillionContext: boolean,
             isDefault: boolean,
             // 注意：apiKey 不导出（安全）
             // 导入时如果 profile 已存在（按 name 判断）：
             //   - merge 模式：跳过
             //   - replace 模式：覆盖 name 不同的，更新已存在的
           }>
         }
         ```

      3. **后端实现**：
         - 读现有 provider service 实现，找到 listProviders 路径
         - 复用现有 getProviderService()、listProviders() 等
         - 文件 IO：使用 electron 的 dialog + fs
         - 错误处理：IO 错误、JSON 解析错误、schema 校验错误都要 catch 并返回友好消息

      ### 前端
      1. **多选 UI**：
         - ProviderCardX 改造：左侧加复选框（多选模式可切换）
         - ProvidersView 顶部加"批量操作工具栏"：全选、取消选择、反选、显示已选 X 个
         - 多选模式切换：默认单选编辑模式；点击"批量导出"进入多选模式

      2. **导出按钮**：
         - 顶部"导出"按钮：导出全部
         - 多选模式下"导出选中"按钮
         - 弹保存对话框 → 写文件 → toast 成功
         - 也支持"复制到剪贴板"（次要入口）

      3. **导入按钮**：
         - 顶部"导入"按钮
         - 弹打开对话框 → 读文件 → 解析 → 显示预览 Modal：
           * 显示即将导入的 N 个 profile
           * 已存在的名字标记为"将更新"
           * 模式选择：merge（跳过已存在）/ replace（覆盖已存在）
           * 确认后执行
         - 也支持"从剪贴板导入"（次要入口，解析 JSON 字符串）

      4. **错误处理**：
         - 文件不存在 / 权限不足 → toast 报错
         - JSON 解析失败 → toast 报错 + 显示原文
         - schema 版本不匹配 → toast 提示并显示当前/期望版本
         - 单个 profile 导入失败 → 跳过并报告，**不**中断整个导入

      5. **可访问性**：
         - 复选框用 label 包裹
         - 模态支持 ESC 关闭
         - 焦点管理（导入预览打开时焦点进入、关闭时回到导入按钮）

      ## 约束
      - **不要导出 apiKey**（安全）
      - **不要改** provider-presets.ts
      - **不要改** ProviderEditPanel 的 UI（那是 provider-form-ui 的事）
      - 文件 IO 用 electron 的 dialog 模块（不要用浏览器 File API）
      - 在 protocol 包加 types，新增 IPC 通道的协议类型要先在 packages/protocol 加好
      - 改动控制在 ProvidersView.tsx、新增 ImportExport*.tsx 组件、ipc/index.ts、
        services/、protocol/src/、preload/

      ## 交付物
      - 修改/新增：
        * packages/protocol/src/provider-export.ts（新文件，ExportPayload schema）
        * packages/protocol/src/index.ts 导出新类型
        * apps/desktop/src/main/ipc/index.ts 新增 4 个通道
        * apps/desktop/src/main/services/provider-service.ts 新增 export/import 方法
        * apps/desktop/src/preload/index.ts 暴露 API
        * apps/desktop/src/renderer/design/views/ProvidersView.tsx 加 UI
        * 可能新增 ImportPreviewModal.tsx、MultiSelectToolbar.tsx
        * styles 增补
      - deliverable.md 列出：
        * 新增的 IPC 通道清单
        * 文件 IO 流程图（文字描述）
        * 错误处理测试用例
        * 安全考虑（apiKey 不导出）
        * tsc/build 输出
    verify_prompt: |
