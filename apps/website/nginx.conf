# Spark Work 官网 nginx 配置
# 关键：公开路由在构建期预渲染为 <route>/index.html；未知地址必须返回真实 404。
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;
    error_page 404 /404.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml text/javascript;

    # 带 hash 的静态资源 —— 长缓存 + immutable
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图标 / manifest 等根目录静态文件
    location ~* \.(?:svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|eot|xml|txt|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /404.html {
        internal;
    }

    location = / {
        try_files /index.html =404;
    }

    # 先匹配预渲染目录首页，解决 /docs 与 public/docs/ 静态目录冲突；
    # 不再 fallback 到首页，避免未知 URL 形成 soft 404。
    location / {
        try_files $uri/index.html $uri.html $uri =404;
    }
}
