appId: com.spark-agent.desktop
productName: Spark Agent
npmRebuild: true
buildDependenciesFromSource: false
directories:
  buildResources: resources
  output: dist
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: resources/icon.ico
linux:
  icon: resources/icon.png
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude.exe'
  - '**/node_modules/playwright/**'
  - '**/node_modules/@playwright/mcp/**'
  - '**/node_modules/playwright-core/**'
files:
  - out/**/*
  - '!**/.DS_Store'
  - '!src/**'
  - '!e2e/**'
  - '!browsers/**'
extraResources:
  - from: out/main/migrations
    to: migrations
    filter:
      - '**/*.sql'
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayIconWin.png
    to: trayIconWin.png
  - from: resources/taskbarIcon.png
    to: taskbarIcon.png
  # Bundled Playwright chromium browser (~150 MB).
  # Downloaded pre-build by `pnpm download-browser` into apps/desktop/browsers/.
  # At runtime, BrowserAutomationViewService points PLAYWRIGHT_BROWSERS_PATH
  # at <resourcesPath>/browsers so playwright finds the bundled binary.
  - from: browsers
    to: browsers
    filter:
      - '**/*'
publish:
  provider: generic
  url: https://releases.spark-agent.dev/${os}/
  channel: latest
