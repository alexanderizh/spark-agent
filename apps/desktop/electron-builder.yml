# 生产安装包配置。公共部分在 electron-builder.base.yml。
# electron-builder 默认读取本文件，生产构建脚本与发布流程都不需要显式 --config。
#
# protocols 放在这里而不是 base：dev 打包必须只注册 spark-agent-dev（见 electron-builder.dev.yml），
# 而 extends 对数组取并集、无法从 base 里移除 spark-agent。
extends: ./electron-builder.base.yml
protocols:
  - name: SparkWork redemption
    schemes:
      - spark-agent
