appId: com.spark-agent.desktop
productName: Spark Agent
npmRebuild: true
buildDependenciesFromSource: false
directories:
  buildResources: resources
  output: dist
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  x64ArchFiles: '**/browsers/**'
win:
  icon: resources/icon.ico
linux:
  icon: resources/icon.png
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/claude.exe'
  - '**/node_modules/playwright/**'
  - '**/node_modules/@playwright/mcp/**'
  - '**/node_modules/playwright-core/**'
files:
  - out/**/*
  - '!**/.DS_Store'
  - '!src/**'
  - '!e2e/**'
  - '!browsers/**'
extraResources:
  - from: out/main/migrations
    to: migrations
    filter:
      - '**/*.sql'
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayIconWin.png
    to: trayIconWin.png
  - from: resources/taskbarIcon.png
    to: taskbarIcon.png
  # Optional Playwright chromium browser (~150 MB).
  # Build scripts no longer download it automatically. If
  # `pnpm download-browser` was run before packaging, this copies
  # apps/desktop/browsers/ into resources/browsers; otherwise the
  # prepare-browser-resource script leaves an empty directory and runtime
  # falls back to system Chrome/Edge or Playwright's default cache.
  - from: browsers
    to: browsers
    filter:
      - '**/*'
publish:
  provider: generic
  url: https://releases.spark-agent.dev/${os}/
  channel: latest
