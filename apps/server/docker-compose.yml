services:
  postgres:
    image: postgres:16-alpine
    container_name: spark-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spark_agent
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spark-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
